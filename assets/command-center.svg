<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">Command center dashboard</title>
  <desc id="desc">Mission control style frame for GitHub analytics and contribution metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4EEFF"/>
      <stop offset="100%" stop-color="#E2D3FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="180" rx="28" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="132" rx="24" fill="#FAF7FF" fill-opacity="0.84" stroke="#b692d9" stroke-opacity="0.3"/>
  <text x="88" y="92" fill="#4F355A" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Live GitHub telemetry</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="16">
    <rect x="660" y="56" width="132" height="44" rx="16" fill="#EDE3FF" stroke="#e33d82" stroke-opacity="0.4"/>
    <text x="686" y="83" fill="#4F355A">STATS</text>
    <rect x="810" y="56" width="132" height="44" rx="16" fill="#EDE3FF" stroke="#e97a2d" stroke-opacity="0.4"/>
    <text x="830" y="83" fill="#4F355A">STREAK</text>
    <rect x="960" y="56" width="132" height="44" rx="16" fill="#EDE3FF" stroke="#f4c397" stroke-opacity="0.4"/>
    <text x="978" y="83" fill="#4F355A">LANGS</text>
    <rect x="810" y="108" width="132" height="30" rx="15" fill="#EDE3FF" stroke="#b692d9" stroke-opacity="0.4"/>
    <text x="824" y="128" fill="#4F355A">ACTIVITY</text>
  </g>
</svg>

