<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Closing terminal panel</title>
  <desc id="desc">Terminal style closing panel with a short philosophy statement.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6FB"/>
      <stop offset="100%" stop-color="#F3D8EE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <rect x="70" y="48" width="1060" height="204" rx="20" fill="#FBF0F8" stroke="#D85C96" stroke-opacity="0.4"/>
  <circle cx="106" cy="74" r="6" fill="#D85C96"/>
  <circle cx="128" cy="74" r="6" fill="#C56BC0"/>
  <circle cx="150" cy="74" r="6" fill="#D9A0E8"/>
  <text x="182" y="80" fill="#8E6D8D" font-family="Consolas, 'Courier New', monospace" font-size="16">terminal://philosophy-engine</text>
  <text x="100" y="128" fill="#C56BC0" font-family="Consolas, 'Courier New', monospace" font-size="20">$ initialize_closing_message</text>
  <text x="100" y="168" fill="#4F355A" font-family="Consolas, 'Courier New', monospace" font-size="28">&gt; Turning data into decisiveness, one system at a time.</text>
  <text x="100" y="208" fill="#765F79" font-family="Consolas, 'Courier New', monospace" font-size="20">&gt; Open to healthcare AI, analytics, product intelligence, and meaningful collaboration _</text>
</svg>



