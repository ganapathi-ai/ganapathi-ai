<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Profile hero banner</title>
  <desc id="desc">Futuristic hero banner with neural network accents and a balanced profile layout for Ganapathi Kakarla.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121319"/>
      <stop offset="45%" stop-color="#24162d"/>
      <stop offset="100%" stop-color="#24162d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17131b" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#17131b" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e33d82"/>
      <stop offset="100%" stop-color="#b692d9"/>
    </linearGradient>
    <linearGradient id="mint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e97a2d"/>
      <stop offset="100%" stop-color="#f4c397"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#4b355f" stroke-opacity="0.28" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="430" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="34" fill="url(#grid)" opacity="0.52"/>

  <g opacity="0.28">
    <path d="M78 84 L220 146 L320 112 L420 174 L560 96 L702 142 L832 90 L964 126 L1108 86" fill="none" stroke="#e33d82" stroke-width="2"/>
    <path d="M104 332 L242 262 L384 310 L510 236 L648 302 L812 244 L952 318 L1088 250" fill="none" stroke="#e97a2d" stroke-width="2"/>
    <circle cx="78" cy="84" r="6" fill="#f4c397"/>
    <circle cx="220" cy="146" r="6" fill="#f4c397"/>
    <circle cx="320" cy="112" r="6" fill="#b692d9"/>
    <circle cx="420" cy="174" r="6" fill="#f4c397"/>
    <circle cx="560" cy="96" r="6" fill="#e33d82"/>
    <circle cx="702" cy="142" r="7" fill="#e97a2d"/>
    <circle cx="832" cy="90" r="6" fill="#f4c397"/>
    <circle cx="964" cy="126" r="6" fill="#b692d9"/>
    <circle cx="1108" cy="86" r="6" fill="#f4c397"/>
  </g>

  <g filter="url(#glow)" opacity="0.34">
    <path d="M98 234 C208 192 314 150 464 182 C598 210 688 284 822 264 C938 248 1018 168 1112 178" fill="none" stroke="url(#cyan)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M142 368 C286 296 358 294 500 214 C632 138 766 132 928 198 C1000 228 1050 230 1118 206" fill="none" stroke="url(#mint)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <rect x="56" y="52" width="1088" height="326" rx="28" fill="url(#panel)" stroke="#e97a2d" stroke-opacity="0.42" stroke-width="1.4"/>
  <rect x="78" y="74" width="1044" height="282" rx="22" fill="none" stroke="#b692d9" stroke-opacity="0.14"/>

  <text x="98" y="156" fill="#f6edf4" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700">Ganapathi Kakarla</text>
  <text x="98" y="204" fill="#f4c397" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">AI Engineer | Data Scientist | Healthcare Specialist</text>
  <text x="98" y="250" fill="#dbcdd8" font-family="Segoe UI, Arial, sans-serif" font-size="20">Building intelligent systems across healthcare analytics, business intelligence,</text>
  <text x="98" y="280" fill="#dbcdd8" font-family="Segoe UI, Arial, sans-serif" font-size="20">machine learning, and product-driven decision support.</text>

  <g transform="translate(98 316)" font-family="Consolas, 'Courier New', monospace" font-size="15">
    <rect width="168" height="34" rx="17" fill="#221725" stroke="#e33d82" stroke-opacity="0.58"/>
    <text x="24" y="22" fill="#f6edf4">Healthcare AI</text>
    <rect x="186" width="184" height="34" rx="17" fill="#221725" stroke="#e97a2d" stroke-opacity="0.58"/>
    <text x="212" y="22" fill="#f6edf4">Business Intelligence</text>
    <rect x="388" width="144" height="34" rx="17" fill="#221725" stroke="#b692d9" stroke-opacity="0.58"/>
    <text x="422" y="22" fill="#f6edf4">LLM Systems</text>
  </g>

  <g transform="translate(916 214)">
    <circle r="92" fill="none" stroke="#5d4571" stroke-width="1.5"/>
    <circle r="68" fill="none" stroke="#7a5c97" stroke-width="1.5"/>
    <circle r="42" fill="#221725" stroke="#f4c397" stroke-width="2"/>
    <circle cx="-72" cy="-22" r="8" fill="#e33d82"/>
    <circle cx="78" cy="-8" r="8" fill="#e97a2d"/>
    <circle cx="-34" cy="74" r="8" fill="#b692d9"/>
    <circle cx="30" cy="-78" r="8" fill="#f4c397"/>
    <path d="M-72 -22 L0 0 L78 -8" fill="none" stroke="#e33d82" stroke-opacity="0.7"/>
    <path d="M0 0 L-34 74" fill="none" stroke="#e97a2d" stroke-opacity="0.7"/>
    <path d="M0 0 L30 -78" fill="none" stroke="#b692d9" stroke-opacity="0.7"/>
    <text x="-26" y="6" fill="#f6edf4" font-family="Consolas, 'Courier New', monospace" font-size="18">AI</text>
  </g>
</svg>
