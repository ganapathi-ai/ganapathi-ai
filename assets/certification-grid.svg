<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Achievement certification grid</title>
  <desc id="desc">Glass card layout summarizing major certification categories and continuous learning themes.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08111d"/>
      <stop offset="100%" stop-color="#13263b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="352" rx="24" fill="#08131f" fill-opacity="0.82" stroke="#38bdf8" stroke-opacity="0.26"/>
  <text x="88" y="70" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="18" letter-spacing="3">ACHIEVEMENT GRID / CERTIFICATIONS</text>
  <text x="88" y="108" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">15+ skill modules unlocked</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(88 144)">
      <rect width="316" height="92" rx="20" fill="#0c1d2b" stroke="#22d3ee" stroke-opacity="0.35"/>
      <rect x="10" y="10" width="316" height="92" rx="20" fill="none" stroke="#22d3ee" stroke-opacity="0.12"/>
      <text x="24" y="32" fill="#67e8f9" font-size="18" font-weight="700">AI Foundations</text>
      <text x="24" y="58" fill="#e2e8f0" font-size="16">ADiRA, Google AI, IBM AI Agents</text>
      <text x="24" y="80" fill="#94a3b8" font-size="14">Core understanding of modern AI systems</text>
    </g>
    <g transform="translate(442 144)">
      <rect width="316" height="92" rx="20" fill="#0c1d2b" stroke="#38bdf8" stroke-opacity="0.35"/>
      <rect x="10" y="10" width="316" height="92" rx="20" fill="none" stroke="#38bdf8" stroke-opacity="0.12"/>
      <text x="24" y="32" fill="#7dd3fc" font-size="18" font-weight="700">Deep Learning</text>
      <text x="24" y="58" fill="#e2e8f0" font-size="16">IIT Ropar NPTEL, Stanford / DeepLearning.AI</text>
      <text x="24" y="80" fill="#94a3b8" font-size="14">Modeling depth from supervised ML to neural nets</text>
    </g>
    <g transform="translate(796 144)">
      <rect width="316" height="92" rx="20" fill="#0c1d2b" stroke="#2dd4bf" stroke-opacity="0.35"/>
      <rect x="10" y="10" width="316" height="92" rx="20" fill="none" stroke="#2dd4bf" stroke-opacity="0.12"/>
      <text x="24" y="32" fill="#5eead4" font-size="18" font-weight="700">GenAI Applications</text>
      <text x="24" y="58" fill="#e2e8f0" font-size="16">IBM multimodal and generative AI application tracks</text>
      <text x="24" y="80" fill="#94a3b8" font-size="14">From models to usable workflows</text>
    </g>
    <g transform="translate(88 258)">
      <rect width="316" height="92" rx="20" fill="#0c1d2b" stroke="#facc15" stroke-opacity="0.35"/>
      <rect x="10" y="10" width="316" height="92" rx="20" fill="none" stroke="#facc15" stroke-opacity="0.12"/>
      <text x="24" y="32" fill="#fde68a" font-size="18" font-weight="700">RAG + Vector Systems</text>
      <text x="24" y="58" fill="#e2e8f0" font-size="16">IBM vector databases, retrievers, and RAG pathways</text>
      <text x="24" y="80" fill="#94a3b8" font-size="14">Retrieval-powered product building</text>
    </g>
    <g transform="translate(442 258)">
      <rect width="316" height="92" rx="20" fill="#0c1d2b" stroke="#fb7185" stroke-opacity="0.35"/>
      <rect x="10" y="10" width="316" height="92" rx="20" fill="none" stroke="#fb7185" stroke-opacity="0.12"/>
      <text x="24" y="32" fill="#fda4af" font-size="18" font-weight="700">Cloud + Productivity</text>
      <text x="24" y="58" fill="#e2e8f0" font-size="16">AWS AI and Cloud, Google AI productivity modules</text>
      <text x="24" y="80" fill="#94a3b8" font-size="14">Practical enablement for modern work</text>
    </g>
    <g transform="translate(796 258)">
      <rect width="316" height="92" rx="20" fill="#0c1d2b" stroke="#c084fc" stroke-opacity="0.35"/>
