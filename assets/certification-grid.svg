<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Achievement certification grid</title>
  <desc id="desc">Glass card layout summarizing major certification categories and continuous learning themes.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121319"/>
      <stop offset="100%" stop-color="#24162d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="352" rx="24" fill="#17131b" fill-opacity="0.82" stroke="#b692d9" stroke-opacity="0.26"/>
  <text x="88" y="90" fill="#f6edf4" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">15+ skill modules unlocked</text>
  <g font-family="Segoe UI, Arial, sans-serif">
