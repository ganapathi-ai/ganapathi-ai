      <text x="24" y="32" fill="#f4c397" font-size="18" font-weight="700">RAG + Vector Systems</text>
      <text x="24" y="58" fill="#f6edf4" font-size="16">IBM vector databases, retrievers, and RAG pathways</text>
      <text x="24" y="80" fill="#aa94aa" font-size="14">Retrieval-powered product building</text>
