<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Achievement certification grid</title>
  <desc id="desc">Glass card layout summarizing major certification categories and continuous learning themes.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4C6DD"/>
      <stop offset="100%" stop-color="#DEBAF2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="440" rx="28" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="392" rx="24" fill="#F1C3DC" fill-opacity="0.82" stroke="#D28BE7" stroke-opacity="0.26"/>
  <text x="72" y="88" fill="#4F355A" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700">Credentials &amp; Continuous Learning</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(72 132)">
      <rect width="320" height="110" rx="20" fill="#EDBEE6" stroke="#D85C96" stroke-opacity="0.35"/>
      <rect x="12" y="12" width="296" height="86" rx="16" fill="none" stroke="#D85C96" stroke-opacity="0.12"/>
      <text x="24" y="34" fill="#D85C96" font-size="18" font-weight="700">AI Foundations</text>
      <text x="24" y="60" fill="#4F355A" font-size="15">ADiRA, Google AI,</text>
      <text x="24" y="80" fill="#4F355A" font-size="15">IBM AI Agents</text>
      <text x="24" y="98" fill="#8E6D8D" font-size="13">Core understanding of modern AI systems</text>
    </g>

    <g transform="translate(440 132)">
      <rect width="320" height="110" rx="20" fill="#EDBEE6" stroke="#D28BE7" stroke-opacity="0.35"/>
      <rect x="12" y="12" width="296" height="86" rx="16" fill="none" stroke="#D28BE7" stroke-opacity="0.12"/>
      <text x="24" y="34" fill="#D28BE7" font-size="18" font-weight="700">Deep Learning</text>
      <text x="24" y="60" fill="#4F355A" font-size="15">IIT Ropar NPTEL,</text>
      <text x="24" y="80" fill="#4F355A" font-size="15">Stanford / DeepLearning.AI</text>
      <text x="24" y="98" fill="#8E6D8D" font-size="13">Supervised ML to neural networks</text>
    </g>

    <g transform="translate(808 132)">
      <rect width="320" height="110" rx="20" fill="#EDBEE6" stroke="#AD63E6" stroke-opacity="0.35"/>
      <rect x="12" y="12" width="296" height="86" rx="16" fill="none" stroke="#AD63E6" stroke-opacity="0.12"/>
      <text x="24" y="34" fill="#AD63E6" font-size="18" font-weight="700">GenAI Applications</text>
      <text x="24" y="60" fill="#4F355A" font-size="15">IBM multimodal and</text>
      <text x="24" y="80" fill="#4F355A" font-size="15">generative AI application tracks</text>
      <text x="24" y="98" fill="#8E6D8D" font-size="13">From models to usable workflows</text>
    </g>

    <g transform="translate(72 260)">
      <rect width="320" height="110" rx="20" fill="#EDBEE6" stroke="#D49BEF" stroke-opacity="0.35"/>
      <rect x="12" y="12" width="296" height="86" rx="16" fill="none" stroke="#D49BEF" stroke-opacity="0.12"/>
      <text x="24" y="34" fill="#AD63E6" font-size="18" font-weight="700">RAG + Vector Systems</text>
      <text x="24" y="60" fill="#4F355A" font-size="15">IBM vector databases,</text>
      <text x="24" y="80" fill="#4F355A" font-size="15">retrievers, and RAG pathways</text>
      <text x="24" y="98" fill="#8E6D8D" font-size="13">Retrieval-powered product building</text>
    </g>

    <g transform="translate(440 260)">
      <rect width="320" height="110" rx="20" fill="#EDBEE6" stroke="#D28BE7" stroke-opacity="0.35"/>
      <rect x="12" y="12" width="296" height="86" rx="16" fill="none" stroke="#D28BE7" stroke-opacity="0.12"/>
      <text x="24" y="34" fill="#D28BE7" font-size="18" font-weight="700">Cloud + Productivity</text>
      <text x="24" y="60" fill="#4F355A" font-size="15">AWS AI and Cloud,</text>
      <text x="24" y="80" fill="#4F355A" font-size="15">Google AI productivity modules</text>
      <text x="24" y="98" fill="#8E6D8D" font-size="13">Practical enablement for modern work</text>
    </g>

    <g transform="translate(808 260)">
      <rect width="320" height="110" rx="20" fill="#EDBEE6" stroke="#AD63E6" stroke-opacity="0.35"/>
      <rect x="12" y="12" width="296" height="86" rx="16" fill="none" stroke="#AD63E6" stroke-opacity="0.12"/>
      <text x="24" y="34" fill="#AD63E6" font-size="18" font-weight="700">Continuous Learning</text>
      <text x="24" y="60" fill="#4F355A" font-size="15">Healthcare, analytics,</text>
      <text x="24" y="80" fill="#4F355A" font-size="15">product, and AI growth loops</text>
      <text x="24" y="98" fill="#8E6D8D" font-size="13">Always shipping while learning</text>
    </g>
  </g>
</svg>






