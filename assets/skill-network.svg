<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Skill network graph</title>
  <desc id="desc">Clustered skill map showing connected strengths across AI, analytics, healthcare, and development.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06111b"/>
      <stop offset="100%" stop-color="#13263a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="460" rx="28" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="412" rx="24" fill="#08131f" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.3"/>
  <text x="88" y="70" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="18" letter-spacing="3">SKILL NETWORK GRAPH</text>
