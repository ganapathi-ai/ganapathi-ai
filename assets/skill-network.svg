<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Core strengths network</title>
  <desc id="desc">Clustered skill map showing connected strengths across AI, analytics, healthcare, and development.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6FB"/>
      <stop offset="100%" stop-color="#F3D8EE"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="500" rx="28" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="452" rx="24" fill="#FFF9FC" fill-opacity="0.85" stroke="#D9A0E8" stroke-opacity="0.3"/>

  <g stroke-linecap="round" opacity="0.48">
