  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="372" rx="24" fill="#08131f" fill-opacity="0.82" stroke="#38bdf8" stroke-opacity="0.28"/>
