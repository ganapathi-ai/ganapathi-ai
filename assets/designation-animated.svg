<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">Animated designation banner</title>
  <desc id="desc">Animated professional designation banner cycling through roles for Ganapathi Kakarla.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121319"/>
      <stop offset="100%" stop-color="#24162d"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e33d82"/>
      <stop offset="50%" stop-color="#b692d9"/>
      <stop offset="100%" stop-color="#e97a2d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="150" rx="24" fill="url(#bg)"/>
  <rect x="28" y="22" width="1144" height="106" rx="18" fill="#17131b" fill-opacity="0.84" stroke="#b692d9" stroke-opacity="0.28"/>
  <path d="M86 112 H1114" stroke="url(#line)" stroke-width="2" opacity="0.6"/>

  <g text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">
    <text x="600" y="86" fill="#f6edf4" opacity="1">
      AI Engineer
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.24;0.34;1"/>
    </text>
    <text x="600" y="86" fill="#f6edf4" opacity="0">
      Data Scientist
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.28;0.34;0.57;0.67;1"/>
    </text>
    <text x="600" y="86" fill="#f6edf4" opacity="0">
      Healthcare Intelligence Builder
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.62;0.68;0.92;1"/>
    </text>
  </g>

  <rect x="914" y="66" width="10" height="28" rx="3" fill="#f4c397">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
